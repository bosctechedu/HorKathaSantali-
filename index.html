<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>HorKathaSantali — Santali Language &amp; Learning Platform</title>
    <meta name="description" content="Complete Santali language suite with Santali Devanagari keyboard, 10,000+ word dictionary, cultural festivals chronicles, and translator by BOSC Tech &amp; Edu." />
    <meta property="og:title" content="HorKathaSantali — Santali Language &amp; Learning Platform" />
    <meta property="og:description" content="Complete Santali language suite with Santali Devanagari keyboard, 10,000+ word dictionary, cultural festivals chronicles, and translator by BOSC Tech &amp; Edu." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HorKathaSantali" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load without blocking first paint; a size-matched local fallback (see index.css) avoids a layout jump on swap.
         Cinzel and the 300 weight were never used, so they are no longer requested. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"></noscript>
    <script>
      // Lite mode for low-end phones / Data Saver / reduced motion: set before first paint (see index.css)
      (function () {
        try {
          var d = document.documentElement, n = navigator, c = n.connection || {};
          var forced = localStorage.getItem('hks_lite');
          var lite = forced === '1' || (forced !== '0' && (
            (n.hardwareConcurrency && n.hardwareConcurrency <= 4) ||
            (n.deviceMemory && n.deviceMemory <= 4) ||
            c.saveData === true || /(^|-)2g$/.test(c.effectiveType || '') ||
            (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)));
          if (lite) d.classList.add('lite');
          document.addEventListener('visibilitychange', function () { d.classList.toggle('hks-hidden', document.hidden); });
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
